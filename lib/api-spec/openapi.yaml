        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── Admin Experiences ─────────────────────────────────────────────────────
  /admin/experiences:
    get:
      operationId: adminListExperiences
      tags: [experiences]
      summary: Admin list all experiences with status filter
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_approval, active, suspended]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All experiences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/experiences/{experienceId}/status:
    patch:
      operationId: adminPatchExperienceStatus
      tags: [experiences]
      summary: Admin update experience status
      security:
        - BearerAuth: []
      parameters:
        - name: experienceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, pending_approval, active, suspended]
              required:
                - status
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/experience-settings:
    get:
      operationId: getExperienceSettings
      tags: [experiences]
      summary: Get all experience module settings (admin only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Settings key-value map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateExperienceSettings
      tags: [experiences]
      summary: Update experience module settings (admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    # ─── Geo ──────────────────────────────────────────────────────────────
    Country:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        code:
          type: string
        flag:
          type: string
      required:
        - id
        - nameEn
        - nameAr
        - code

    City:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        countryId:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
      required:
        - id
        - nameEn
        - nameAr
        - countryId

    # ─── Categories ───────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        icon:
          type: string
        slug:
          type: string
      required:
        - id
        - nameEn
        - nameAr
        - slug

    Occasion:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        icon:
          type: string
        slug:
          type: string
      required:
        - id
        - nameEn
        - nameAr
        - slug

    # ─── Users ────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        email:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
        isVerified:
          type: boolean
        isEmailVerified:
          type: boolean
        points:
          type: integer
        credibilityScore:
          type: string
          description: Numeric credibility score 0–100 (stored as decimal string)
        level:
          type: integer
        levelTitle:
          type: string
        preferredLanguage:
          type: string
          enum: [en, ar]
        cityId:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - points
        - level
        - levelTitle
        - isVerified
        - isEmailVerified
        - preferredLanguage
        - createdAt

    UserCard:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        avatarUrl:
          type: string
        isVerified:
          type: boolean
        level:
          type: integer
        levelTitle:
          type: string
        reviewCount:
          type: integer
      required:
        - id
        - isVerified
        - level
        - levelTitle
        - reviewCount

    UserProfile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        reviewCount:
          type: integer
        bookingCount:
          type: integer
        followerCount:
          type: integer
        followingCount:
          type: integer
        isFollowing:
          type: boolean
      required:
        - user
        - reviewCount
        - bookingCount
        - followerCount
        - followingCount
        - isFollowing

    CreateUserRequest:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        preferredLanguage:
          type: string
          enum: [en, ar]
          default: en
        cityId:
          type: integer
      required:
