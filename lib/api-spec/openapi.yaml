openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tabaq | طبق - Food & Dining Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Authentication operations (OTP-based)
  - name: health
    description: Health operations
  - name: countries
    description: Country and city operations
  - name: categories
    description: Cuisine categories and tags
  - name: restaurants
    description: Restaurant operations
  - name: dishes
    description: Dish operations
  - name: menus
    description: Menu management
  - name: bookings
    description: Table reservation operations
  - name: offers
    description: Offers and deals operations
  - name: vouchers
    description: Voucher and coupon operations
  - name: reviews
    description: Review and rating operations
  - name: users
    description: User profile operations
  - name: search
    description: Search and discovery operations
  - name: events
    description: Dining events operations
  - name: experiences
    description: Food experiences operations

paths:
  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request an OTP code
      description: Sends a one-time password to the provided phone or email. In dev mode, the code is returned in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: "+966512345678"
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  devCode:
                    type: string
                    description: Only present in development mode
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and sign in
      description: Verifies the OTP code and creates or fetches the user, returning a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                phone:
                  type: string
                email:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                nameEn:
                  type: string
                nameAr:
                  type: string
                preferredLanguage:
                  type: string
                  enum: [en, ar]
                cityId:
                  type: integer
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (clears session cookie)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/verify-email/request:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      summary: Request an email verification link (authenticated)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Verification link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  devVerifyUrl:
                    type: string
                  devToken:
                    type: string

  /auth/verify-email/confirm:
    get:
      operationId: confirmEmailVerification
      tags: [auth]
      summary: Confirm email via token from verification link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId:
                    type: integer

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Countries & Cities ───────────────────────────────────────────────────
  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: List all countries
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"

  /countries/{countryId}/cities:
    get:
      operationId: listCitiesByCountry
      tags: [countries]
      summary: List cities in a country
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"

  # ─── Categories ───────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List cuisine categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /occasions:
    get:
      operationId: listOccasions
      tags: [categories]
      summary: List occasion types
      responses:
        "200":
          description: List of occasions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Occasion"

  # ─── Restaurants ──────────────────────────────────────────────────────────
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [restaurants]
      summary: List and filter restaurants
      parameters:
        - name: cityId
          in: query
          schema:
            type: integer
        - name: countryId
          in: query
          schema:
            type: integer
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: occasionId
          in: query
          schema:
            type: integer
        - name: priceTier
          in: query
          schema:
            type: string
            enum: [budget, mid, upscale, fine_dining]
        - name: minRating
          in: query
          schema:
            type: number
        - name: featured
          in: query
          schema:
            type: boolean
        - name: hasParking
          in: query
          schema:
            type: boolean
        - name: hasOutdoorSeating
          in: query
          schema:
            type: boolean
        - name: openNow
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of restaurants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantListResponse"
    post:
      operationId: createRestaurant
      tags: [restaurants]
      summary: Create a new restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurantRequest"
      responses:
        "201":
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"

  /restaurants/featured:
    get:
      operationId: getFeaturedRestaurants
      tags: [restaurants]
      summary: Get featured restaurants for homepage
      parameters:
        - name: cityId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 8
      responses:
        "200":
          description: Featured restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantCard"

  /restaurants/{restaurantId}:
    get:
      operationId: getRestaurant
      tags: [restaurants]
      summary: Get restaurant details
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateRestaurant
      tags: [restaurants]
      summary: Update restaurant details
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRestaurantRequest"
      responses:
        "200":
          description: Updated restaurant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"

  /restaurants/{restaurantId}/follow:
    post:
      operationId: followRestaurant
      tags: [restaurants]
      summary: Follow a restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatusResponse"
    delete:
      operationId: unfollowRestaurant
      tags: [restaurants]
      summary: Unfollow a restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatusResponse"

  /restaurants/{restaurantId}/availability:
    get:
      operationId: getRestaurantAvailability
      tags: [restaurants]
      summary: Get available time slots for a date
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: partySize
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"

  # ─── Menus ────────────────────────────────────────────────────────────────
  /restaurants/{restaurantId}/menus:
    get:
      operationId: getRestaurantMenus
      tags: [menus]
      summary: Get menus for a restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restaurant menus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Menu"
    post:
      operationId: createMenu
      tags: [menus]
      summary: Create a menu for a restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuRequest"
      responses:
        "201":
          description: Menu created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"

  # ─── Dishes ───────────────────────────────────────────────────────────────
  /dishes:
    get:
      operationId: listDishes
      tags: [dishes]
      summary: List and filter dishes
      parameters:
        - name: restaurantId
          in: query
          schema:
            type: integer
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: cityId
          in: query
          schema:
            type: integer
        - name: dietaryTag
          in: query
          schema:
            type: string
            enum: [halal, vegetarian, vegan, gluten_free]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [rating, popularity, newest]
            default: rating
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of dishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishListResponse"

  /dishes/trending:
    get:
      operationId: getTrendingDishes
      tags: [dishes]
      summary: Get trending dishes for homepage
      parameters:
        - name: cityId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 8
      responses:
        "200":
          description: Trending dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishCard"

  /dishes/{dishId}:
    get:
      operationId: getDish
      tags: [dishes]
      summary: Get dish details
      parameters:
        - name: dishId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dish details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /restaurants/{restaurantId}/dishes:
    get:
      operationId: getRestaurantDishes
      tags: [dishes]
      summary: Get dishes for a restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restaurant dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dish"
    post:
      operationId: createDish
      tags: [dishes]
      summary: Create a dish for a restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDishRequest"
      responses:
        "201":
          description: Dish created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"

  # ─── Bookings ─────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings (for current user or restaurant)
      parameters:
        - name: restaurantId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed, no_show]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a table reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "422":
          description: Validation error or slot unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking details
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (confirm/cancel)
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusRequest"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # ─── Offers ───────────────────────────────────────────────────────────────
  /offers:
    get:
      operationId: listOffers
      tags: [offers]
      summary: List available offers
      parameters:
        - name: restaurantId
          in: query
          schema:
            type: integer
        - name: cityId
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferListResponse"
    post:
      operationId: createOffer
      tags: [offers]
      summary: Create an offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfferRequest"
      responses:
        "201":
          description: Offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"

  /offers/{offerId}:
    get:
      operationId: getOffer
      tags: [offers]
      summary: Get offer details
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Offer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"

  # ─── Vouchers ─────────────────────────────────────────────────────────────
  /vouchers:
    get:
      operationId: listVouchers
      tags: [vouchers]
      summary: List vouchers (user's owned vouchers)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, used, expired]
      responses:
        "200":
          description: List of vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voucher"
    post:
      operationId: purchaseVoucher
      tags: [vouchers]
      summary: Purchase a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseVoucherRequest"
      responses:
        "201":
          description: Voucher purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"

  /vouchers/{voucherId}:
    get:
      operationId: getVoucher
      tags: [vouchers]
      summary: Get voucher details
      parameters:
        - name: voucherId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voucher details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"

  /vouchers/{voucherId}/redeem:
    post:
      operationId: redeemVoucher
      tags: [vouchers]
      summary: Redeem a voucher (mark as used)
      parameters:
        - name: voucherId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voucher redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vouchers/{voucherId}/gift:
    post:
      operationId: giftVoucher
      tags: [vouchers]
      summary: Gift a voucher to someone
      parameters:
        - name: voucherId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftVoucherRequest"
      responses:
        "200":
          description: Voucher gifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"

  # ─── Reviews ──────────────────────────────────────────────────────────────
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews
      parameters:
        - name: restaurantId
          in: query
          schema:
            type: integer
        - name: dishId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{reviewId}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: Get review details
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    patch:
      operationId: updateReview
      tags: [reviews]
      summary: Update a review (author only)
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewRequest"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /reviews/{reviewId}/like:
    post:
      operationId: likeReview
      tags: [reviews]
      summary: Like a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeStatusResponse"

  /reviews/{reviewId}/report:
    post:
      operationId: reportReview
      tags: [reviews]
      summary: Report a review as inappropriate
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
